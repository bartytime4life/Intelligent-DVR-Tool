<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">Install. Check. Start.</title><desc id="desc">Software setup comes before a camera or an analysis job. Install: Install-Mac / Install-Windows; Linux: --install; Keep existing private settings. Check: Run the readiness check; Resolve failed checks first; No device connections made. Start: Open the printed local address; Keep the terminal running; Connect a source deliberately.</desc>
