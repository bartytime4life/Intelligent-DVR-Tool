<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">From a clip to a reviewed report</title><desc id="desc">Keep the original recording and its matching result together. Capture or import: Record an explicit webcam clip; Or import an approved local file; Import alone does not analyze. Analyze recording: Choose the model and rules; Inspect progress or cancel; Check complete / partial status. Review and export: Inspect the matched source; Send observations to Events; Export decisions and result pair.</desc>
