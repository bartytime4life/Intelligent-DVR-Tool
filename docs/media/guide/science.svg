<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">Inspect pixels. Test geometry.</title><desc id="desc">Diagnostics and planar calibration have explicit limits. Freeze an image: Choose an explicit local frame; Inspect histogram and detail; Measure sampled image pixels. Compare A and B: Capture both views deliberately; Inspect differences and exposure; Keep originals and context. Calibrate a plane: Enter measured ground markers; Use independent check markers; Review residual error and limits.</desc>
