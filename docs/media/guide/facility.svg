<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">Build the space in layers</title><desc id="desc">Plan geometry and camera coverage are estimates until measured. Site and shell: Choose a map origin or local grid; Add a footprint or reviewed draft; Set building size and floors. Interior and openings: Sketch rooms and shared walls; Place doors, windows and stairs; Preview, save, or Undo. Cameras and backup: Place and aim planned cameras; Inspect estimated coverage; Export the named facility plan.</desc>
