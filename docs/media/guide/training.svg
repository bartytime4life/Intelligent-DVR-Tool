<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">Tune the setting for this view</title><desc id="desc">Guided training adjusts a rule threshold; it does not retrain the model. Check the camera: Train → Start session; Frame the room and check light; Connect camera when ready. Follow the prompts: In view → away → far → hidden; Keep the window in front; Let local analysis finish. Compare and apply: Inspect found / missed moments; Compare threshold settings; Save a new rule or keep current.</desc>
