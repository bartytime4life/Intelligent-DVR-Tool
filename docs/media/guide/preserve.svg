<text x="48" y="105" fill="#f1f6fc" font-family="Arial,sans-serif" font-size="39" font-weight="700">Save the work you want to keep</text>
<text x="48" y="144" fill="#b2c2d3" font-family="Arial,sans-serif" font-size="21">A Git checkout is not a backup of recordings or browser storage.</text>
