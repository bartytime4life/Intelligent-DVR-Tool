<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">Save the work you want to keep</title><desc id="desc">A Git checkout is not a backup of recordings or browser storage. Browser exports: Export reviews, rules and plans; Keep the same browser and port; Browser storage is separate. Private local folder: Back up models and catalog; Keep recordings, trained, people; Preserve private source settings. Verified backup: Keep a copy outside the checkout; Verify it before updating; Install → Check → Start again.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0c1a29"/><stop offset="1" stop-color="#101e2b"/></linearGradient></defs>
