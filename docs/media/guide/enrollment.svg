<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="610" viewBox="0 0 1440 610" role="img" aria-labelledby="title desc"><title id="title">A local baseline, then human review</title><desc id="desc">A possible match is a suggestion; it is not proof of identity. Get agreement first: Enter the person’s name; Confirm the person agrees; No capture before consent. Capture and check: Follow the guided face views; Run an optional baseline check; Template stays on this computer. Review a suggestion: Analyze a local recording; Check for enrolled people; Confirm or dismiss the suggestion.</desc>
