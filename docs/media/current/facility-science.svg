middle">C</text><circle cx="1097" cy="391" r="14" fill="#53401d" stroke="#f4c875" stroke-width="2.5"/><text x="1097" y="396" fill="#ffe4ae" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="800" text-anchor="middle">C</text><path d="M660 352h118" fill="none" stroke="#72e9da" stroke-width="2" marker-end="url(#arrow)"/><text x="719" y="331" fill="#c6f9ed" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="700" text-anchor="middle">PLANAR FIT</text><text x="78" y="496" fill="#bfe0e2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" >1–4 fitting points · C held out</text><text x="835" y="496" fill="#bfe0e2" font-family="Arial,Helvetica,sans-serif" font-size="14" font-weight="600" >Ruler stays inside the fitted boundary</text><rect x="50" y="531" width="304" height="32" rx="15" fill="#123d46" stroke="#408386" stroke-width="1.5"/><text x="202" y="553" fill="#bbf4e8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">INDEPENDENT CHECK</text><rect x="375" y="531" width="310" height="32" rx="15" fill="#123d46" stroke="#408386" stroke-width="1.5"/><text x="530" y="553" fill="#bbf4e8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">NO EXTRAPOLATION</text><rect x="708" y="531" width="323" height="32" rx="15" fill="#123d46" stroke="#408386" stroke-width="1.5"/><text x="869.5" y="553" fill="#bbf4e8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">REPORT FIT AND CHECK ERROR</text><rect x="1057" y="531" width="330" height="32" rx="15" fill="#123d46" stroke="#408386" stroke-width="1.5"/><text x="1222" y="553" fill="#bbf4e8" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="700" text-anchor="middle">NEVER CLAIM DEPTH / IDENTITY</text><path d="M45 570H1395" fill="none" stroke="#365d67" stroke-width="1" /><text x="45" y="591" fill="#a8c7cc" font-family="Arial,Helvetica,s