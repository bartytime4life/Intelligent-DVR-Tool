<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 515" width="1440" height="515" role="img"><defs><linearGradient id="sky" x2=".95" y2="1"><stop stop-color="#071422"/><stop offset=".55" stop-color="#143947"/><stop offset="1" stop-color="#081823"/></linearGradient><radialGradient id="lit"><stop stop-color="#238a98" stop-opacity=".34"/><stop offset="1" stop-color="#238a98" stop-opacity="0"/></radialGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" stroke="#78e5dc" opacity=".1" fill="none"/></pattern><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="none" stroke="#6be6da" stroke-width="1.5"/></marker></defs><rect width="1440" height="515" fill="url(#sky)"/><rect width="1440" height="515" fill="url(#grid)"/><text x="46" y="64" fill="#f4ffff" font-family="Arial,Helvetica,sans-serif" font-size="34" font-weight="800" >EVERY FILE HAS A DIFFERENT BOUNDARY</text><text x="48" y="103" fill="#b7cdd3" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" >Keep previews, local recordings, evidence summaries and explicit exports distinguishable.</text><rect x="48" y="157" width="300" height="210" rx="16" fill="#102c39" stroke="#3b7181" stroke-width="1.5"/><rect x="68" y="187" width="7" height="36" rx="3" fill="#75e9df"/><text x="90" y="209" fill="#efffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" >BROWSER SESSION</text><text x="70" y="276" fill="#75e9df" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" >Previews / temporary clips</text><path d="M349 272h44" fill="none" stroke="#72e9da" stroke-width="2" marker-end="url(#arrow)"/><rect x="394" y="157" width="300" height="210" rx="16" fill="#102c39" stroke="#3b7181" stroke-width="1.5"/><rect x="414" y="187" width="7" height="36" rx="3" fill="#78bee4"/><text x="436" y="209" fill="#efffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" >LOCAL PC SERVICE</text><text x="416" y="276" fill="#78bee4" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" >Recording / CPU analysis</text><path d="M695 272h44" fill="none" stroke="#72e9da" stroke-width="2" marker-end="url(#arrow)"/><rect x="740" y="157" width="300" height="210" rx="16" fill="#102c39" stroke="#3b7181" stroke-width="1.5"/><rect x="760" y="187" width="7" height="36" rx="3" fill="#f0c575"/><text x="782" y="209" fill="#efffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" >HUMAN REVIEW</text><text x="762" y="276" fill="#f0c575" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" >Decision / notes / stills</text><path d="M1041 272h44" fill="none" stroke="#72e9da" stroke-width="2" marker-end="url(#arrow)"/><rect x="1086" y="157" width="300" height="210" rx="16" fill="#102c39" stroke="#3b7181" stroke-width="1.5"/><rect x="1106" y="187" width="7" height="36" rx="3" fill="#d6b8ef"/><text x="1128" y="209" fill="#efffff" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="800" >EXPLICIT EXPORT</text><text x="1108" y="276" fill="#d6b8ef" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="500" >User-chosen destination</text><rect x="57" y="398" width="1324" height="58" rx="16" fill="#3a3024" stroke="#9a7743" stroke-width="1.5"/><text x="78" y="435" fill="#ffdfa7" font-family="Arial,Helvetica,sans-serif" font-size="17" font-weight="700" >NO CAMERA CREDENTIALS IN EXPORTED CALIBRATION. A SHA-256 MATCH IS CORRESPONDENCE, NOT AUTHENTICITY.</text><path d="M45 475H1395" fill="none" stroke="#365d67" stroke-width="1" /><text x="45" y="496" fill="#a8c7cc" font-family="Arial,Helvetica,sans-serif" font-size="12" font-weight="600" >LOCAL-FIRST DOES NOT REMOVE THE NEED FOR SECURITY AND RETENTION CONTROLS</text><text x="1396" y="496" fill="#8dc5bf" font-family="Arial,Helvetica,sans-serif" font-size="11" font-weight="700" text-anchor="end">SCHEMATIC · NOT CAMERA EVIDENCE</text></svg>