name: Facility browser regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  facility-browser:
    # Playwright 1.56.1 cannot install Chromium on the Ubuntu 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.facility.config.mjs
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r edge/requirements-qualification.txt
      - run: npm run build
      - name: Local service with real synthetic CPU inference and browser recovery
        run: npx playwright test --config=playwright.analysis.config.mjs
      - name: Webcam and synthetic RTSP end-to-end feed checks
        run: npx playwright test --config=playwright.feeds.config.mjs
      - name: One-camera recorder with controlled RTSP, CPU analysis and browser review
        run: npx playwright test --config=playwright.recorder.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facility-browser-evidence
          path: |
            qa-local/facility-browser-results.json
            qa-local/analysis-browser-results.json
            qa-local/feeds-browser-results.json
            qa-local/recorder-browser-results.json
            test-results/
