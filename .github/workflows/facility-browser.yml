name: Facility browser regression
on: [push, pull_request]
permissions:
  contents: read
jobs:
  facility-browser:
    # Playwright 1.56.1 cannot install Chromium on the Ubuntu 26.04 latest image.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save --package-lock=false @playwright/test@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config=playwright.facility.config.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: facility-browser-evidence
          path: |
            qa-local/facility-browser-results.json
            test-results/
