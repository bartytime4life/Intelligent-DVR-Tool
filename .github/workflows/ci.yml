name: Pilot checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r edge/requirements-test.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check-docs.py
      - run: python scripts/build-wiki.py --check
