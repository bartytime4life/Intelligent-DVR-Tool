name: Cross-platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm ci
      - run: npm run build
      - name: Frontend and actual loopback geo delivery
        run: npm test
        env:
          DVR_TEST_SOCKETS: "1"
      - run: npm run test:sites
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r edge/requirements-qualification.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
        env:
          DVR_TEST_SOCKETS: "1"
      - name: Check out pinned PR 20 for synthetic comparison
        if: runner.os == 'Linux'
        uses: actions/checkout@v4
        with:
          ref: 50349bc758dedb6363c728e4893bedcedafc3808
          path: .ci-pr20-baseline
          persist-credentials: false
      - name: Matched synthetic durable probes
        if: runner.os == 'Linux'
        run: |
          mkdir -m 700 "$RUNNER_TEMP/durable-profiling"
          python scripts/benchmark-ack.py --source-root .ci-pr20-baseline --label pr20-A1 --output "$RUNNER_TEMP/durable-profiling/ack-A1.json"
          python scripts/benchmark-ack.py --label candidate-B1 --output "$RUNNER_TEMP/durable-profiling/ack-B1.json"
          python scripts/benchmark-ack.py --label candidate-B2 --output "$RUNNER_TEMP/durable-profiling/ack-B2.json"
          python scripts/benchmark-ack.py --source-root .ci-pr20-baseline --label pr20-A2 --output "$RUNNER_TEMP/durable-profiling/ack-A2.json"
          python scripts/profile-durable.py --source-root .ci-pr20-baseline --seconds 2 --payload-bytes 388800 --output "$RUNNER_TEMP/durable-profiling/A1.json"
          python scripts/profile-durable.py --seconds 2 --payload-bytes 388800 --output "$RUNNER_TEMP/durable-profiling/B1.json"
          python scripts/profile-durable.py --seconds 2 --payload-bytes 388800 --output "$RUNNER_TEMP/durable-profiling/B2.json"
          python scripts/profile-durable.py --source-root .ci-pr20-baseline --seconds 2 --payload-bytes 388800 --output "$RUNNER_TEMP/durable-profiling/A2.json"
          python scripts/profile-durable.py --seconds 2 --payload-bytes 388800 --profile --output "$RUNNER_TEMP/durable-profiling/profile.json"
          python scripts/profile-durable.py --seconds 2 --payload-bytes 388800 --profile --no-journal --output "$RUNNER_TEMP/durable-profiling/control.json"
          python scripts/summarize-durable-probes.py "$RUNNER_TEMP/durable-profiling"
      - name: Retain synthetic durable receipts
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-durable-profiling
          path: '${{ runner.temp }}/durable-profiling/*.json'
          retention-days: 14
      - name: Actual source launcher local geo delivery
        run: python scripts/smoke-source-facility.py
      - run: python scripts/check-docs.py
      - run: python scripts/build-wiki.py --check
      - name: Linux launcher syntax
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/run-linux.sh
          DVR_PYTHON=python bash scripts/run-linux.sh --help
      - name: Windows launcher syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Start-IntelligentDvr.ps1'), [ref]$null, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          python -m edge.pc_setup --help
