name: Cross-platform checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run test:sites
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r edge/requirements-qualification.txt
      - run: python -m unittest discover -s tests -p 'test_*.py'
      - run: python scripts/check-docs.py
      - run: python scripts/build-wiki.py --check
      - name: Linux launcher prerequisites
        if: runner.os == 'Linux'
        run: |
          bash -n scripts/run-linux.sh
          DVR_PYTHON=python bash scripts/run-linux.sh --check
      - name: Windows launcher prerequisites
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ParseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile((Join-Path $PWD 'scripts/Start-IntelligentDvr.ps1'), [ref]$null, [ref]$ParseErrors) | Out-Null
          if ($ParseErrors.Count) { throw ($ParseErrors | Out-String) }
          ./scripts/Start-IntelligentDvr.ps1 -Check -Python python
